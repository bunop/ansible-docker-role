---
# Docker CE from the upstream repository, with a signed-by keyring (apt-key is
# gone since Ubuntu 24.04+)
- name: Remove legacy Docker apt key and repository
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/trusted.gpg.d/docker.gpg
    - /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
  tags:
    - packages
    - docker

- name: Add Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ docker_apt_arch }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg
  tags:
    - packages
    - docker

# deb822_repository does not refresh the cache: always update it (no
# cache_valid_time), or a new repository is ignored, also when retrying
# after a failed run
- name: Install Docker Community Edition
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  tags:
    - packages
    - docker

# the old standalone binary has been replaced by the compose plugin: keep the
# `docker-compose` command as a thin wrapper
- name: Install docker-compose wrapper for the compose plugin
  ansible.builtin.copy:
    src: docker-compose
    dest: "{{ docker_compose_path }}"
    owner: root
    group: root
    mode: "0755"
  tags:
    - packages
    - docker
    - docker-compose

- name: Add docker configuration file
  ansible.builtin.copy:
    content: "{{ docker_daemon_options | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker
  tags:
    - configure
    - docker

- name: Ensure docker is started
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  tags:
    - service
    - docker
